<!DOCTYPE html>
<html lang="en">

          <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>calculator</title>
                    <link rel="stylesheet" href="style.css">
          </head>

          <body>

                    <body>
                              <div id="container">
                                        <div id="text_container">
                                                  <input id="inputContainer" type="text">
                                        </div>
                                        
                                        <div id="keypad_container">
                                                  <div id="symbol_container" class="child">
                                                            <button id="addBtn" class="symbols">+</button>
                                                            <button id="subtractingBtn" class="symbols">-</button>
                                                            <button id="productBtn" class="symbols">*</button>
                                                            <button id="divideBtn" class="symbols">/</button>
                                                            <button id="clearBtn" class="symbols">C</button>
                                                  </div>
                                                  <div id="number_container" class="child">
                                                            <button id="Btn7" class="number">7</button>
                                                            <button id="Btn8" class="number">8</button>
                                                            <button id="Btn9" class="number">9</button>
                                                            <button id="Btn4" class="number">4</button>
                                                            <button id="Btn5" class="number">5</button>
                                                            <button id="Btn6" class="number">6</button>
                                                            <button id="Btn1" class="number">1</button>
                                                            <button id="Btn2" class="number">2</button>
                                                            <button id="Btn3" class="number">3</button>
                                                            <button id="Btn0" class="number">0</button>
                                                            <button id="decimalBtn" class="number">.</button>
                                                            <button id="ansBtn" class="number">=</button>
                                                  </div>
                                        </div>
                              </div>
                              <script src="app.js"></script>
                    </body>
          </body>

</html>
